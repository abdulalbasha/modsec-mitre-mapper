
input {
  udp {
    port  => 5000
    codec => json
    type  => "mitter"
  }
}


filter {
if [type] == "mitter" {



  # 0) Drop TRAFFIC logs
  if [event_type] == "TRAFFIC" {
    drop { }
  }

  # 1) timestamp -> @timestamp
  if [timestamp] {
    date {
      match  => [ "timestamp", "ISO8601" ]
      timezone => "Asia/Riyadh"
      target => "@timestamp"
    }
  }

  # 2) network -> ECS
  if [network] {
    mutate {
      add_field => {
        "[source][ip]"        => "%{[network][source_ip]}"
        "[source][port]"      => "%{[network][source_port]}"
        "[destination][ip]"   => "%{[network][dest_ip]}"
        "[destination][port]" => "%{[network][dest_port]}"
      }
      convert => {
        "[source][port]"      => "integer"
        "[destination][port]" => "integer"
      }
    }
  }

  # 3) http -> ECS
  if [http] {
    mutate {
      add_field => {
        "[url][domain]"                  => "%{[http][url_domain]}"
        "[url][path]"                    => "%{[http][url_path]}"
        "[url][original]"                => "%{[http][full_uri]}"
        "[http][request][method]"        => "%{[http][method]}"
        "[user_agent][original]"         => "%{[http][user_agent]}"
        "[http][request][body][content]" => "%{[http][post_data]}"
      }
    }
  }

  # 4) ATTACK -> ECS event.*
  if [event_type] == "ATTACK" {
    mutate {
      add_field => {
        "[event][kind]"     => "alert"
        "[event][category]" => "network"
        "[event][type]"     => "indicator"
      }
    }
  }

  # 5) modsec_data -> rule.*, event.severity, tags
  if [modsec_data] {
    mutate {
      add_field => {
        "[rule][id]"              => "%{[modsec_data][rule_id]}"
        "[rule][description]"     => "%{[modsec_data][message]}"
        "[event][severity_label]" => "%{[modsec_data][severity]}"
      }
    }

    if [modsec_data][attack_tags] {
      mutate {
        copy => { "[modsec_data][attack_tags]" => "[tags]" }
      }
    }

    if [modsec_data][severity] == "CRITICAL" {
      mutate { add_field => { "[event][severity]" => "8" } }
    } else if [modsec_data][severity] == "INFO" {
      mutate { add_field => { "[event][severity]" => "2" } }
    } else if [modsec_data][severity] == "WARNING" {
      mutate { add_field => { "[event][severity]" => "5" } }
    }
    mutate { convert => { "[event][severity]" => "integer" } }
  }

  # 6) mitre_mapping -> threat.* (+ all_techniques)
  if [mitre_mapping] and [mitre_mapping][primary_technique] {
    mutate {
      add_field => {
        "[threat][tactic][name]"    => "%{[mitre_mapping][tactic]}"
        "[threat][technique][id]"   => "%{[mitre_mapping][primary_technique]}"
        "[threat][technique][name]" => "%{[mitre_mapping][technique_name]}"
      }
    }

    if [mitre_mapping][all_techniques] {
      mutate {
        copy => { "[mitre_mapping][all_techniques]" => "[threat][technique][id_all]" }
      }
    }

    if [mitre_mapping][categories_detected] {
      mutate {
        copy => { "[mitre_mapping][categories_detected]" => "[rule][category]" }
      }
    }
  }

  # 7) metadata.log_source -> log.file.path
  if [metadata][log_source] {
    mutate {
      add_field => {
        "[log][file][path]" => "%{[metadata][log_source]}"
      }
    }
  }

  # 8) Drop original fields
  mutate {
  remove_field => [
    "timestamp",
    "event_type",
    "network",
    "[http][url_domain]",
    "[http][url_path]",
    "[http][full_uri]",
    "[http][method]",
    "[http][user_agent]",
    "[http][post_data]",
    "[http][host_name]",
    "modsec_data",
    "mitre_mapping",
    "metadata"
  ]
  }
}

}


output {
if [type] == "mitter" {
    elasticsearch {
      hosts => ["http://192.168.1.40:9200"]
      index => "mitter_mapped_events-%{+YYYY.MM.dd}"
      user => "yourusername"
      password => "yourpassword"

    }
  }

}